name: TW Podcast Pipeline
on:
  # 時間由 local 的 TriLine 排程決定：17:15 的影片 job 推完文字稿後呼叫
  # /actions/workflows/tw2.yml/dispatches。這裡刻意沒有 schedule —— 讓 GitHub
  # 自己決定時間會跟 local 的 17:05 價格發布脫鉤，而且同一天可能跑兩次。
  workflow_dispatch:

# 兩次 dispatch 撞在一起時排隊而不是同時產一集（重複上傳到 B2 / RSS）。
concurrency:
  group: podcast-tw
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
        # Existing Secrets
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}  
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} 
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        EMAIL: ${{ secrets.EMAIL }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PODCAST_DIR: ${{ github.workspace }}  
        
        # 🟢 FIX: Set environment variable to agree to Coqui TOS (Fixes EOFError)
        COQUI_TOS_AGREED: 1 
        
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 1. Install system dependency (ffmpeg)
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 2. Install all Python dependencies. 
      # (Assumes requirements.txt now specifies minimum versions for TTS & transformers)
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      # 3. Run the main script
      - name: Run Podcast Generation
        run: python main.py --mode tw
      
      # 4. Commit and Push
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/ docs/ strategies/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "TW Podcast $(date -u '+%Y-%m-%d %H:%M UTC') published"
          git push
